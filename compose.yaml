services:
  api:
    build: .
    image: news-crawler:local

    env_file:
      - .env

    environment:
      DB_HOST: host.docker.internal

    ports:
      - "8080:8080"

    restart: unless-stopped

  crawler:
    build: .
    image: news-crawler:local

    command: ["/app/crawler"]

    env_file:
      - .env

    environment:
      DB_HOST: host.docker.internal

    restart: unless-stopped