services:
  db:
    image: harbor.telecom.tm/bashim/postgress:17
    container_name: news-crawler-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_articles.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./migrations/000002_add_languages_urls.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./migrations/000003_create_categories.up.sql:/docker-entrypoint-initdb.d/003.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: harbor.telecom.tm/bashim/news-crawler:latest
    container_name: news-crawler-api
    command: ["/app/api"]
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: db

    ports:
      - "127.0.0.1:8080:8080"

  crawler:
    image: harbor.telecom.tm/bashim/news-crawler:latest
    container_name: news-crawler-crawler
    command: ["/app/crawler"]
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: db

volumes:
  postgres_data: